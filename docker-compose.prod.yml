services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cricstream_backend_prod
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - cricket_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - cricstream_prod_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cricstream_frontend_prod
    restart: unless-stopped
    networks:
      - cricstream_prod_net

  nginx:
    image: nginx:alpine
    container_name: cricstream_gateway_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - cricstream_prod_net

  certbot:
    image: certbot/certbot:latest
    container_name: cricstream_certbot_prod
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - cricstream_prod_net

volumes:
  cricket_data:
  certbot_conf:
  certbot_www:

networks:
  cricstream_prod_net:
    driver: bridge
